<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Party</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #000000; font-family: "Segoe UI", sans-serif; }
    #canvas-container { width: 100%; height: 100vh; display: block; }

    #ui-layer {
      position: absolute; bottom: 30px; width: 100%;
      text-align: center; pointer-events: none; z-index: 100;
    }

    .badge {
      display: inline-block; background: rgba(0,0,0,0.7);
      border: 2px solid #7CFFCB; color: #7CFFCB;
      padding: 10px 25px; border-radius: 50px;
      font-size: 18px; font-weight: 800; margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(124, 255, 203, 0.5);
      text-shadow: 0 0 10px #7CFFCB;
    }

    .guide { color: #ccc; font-size: 13px; margin-bottom: 20px; text-shadow: 0 2px 4px black; }

    button {
      pointer-events: auto; cursor: pointer;
      background: linear-gradient(to bottom, #7C4DFF, #311B92);
      color: #FFF; border: 2px solid #FFEA00;
      padding: 15px 50px; border-radius: 30px;
      font-weight: 900; font-size: 16px;
      box-shadow: 0 0 30px rgba(124, 77, 255, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    #camera-preview {
      position: absolute; top: 15px; right: 15px;
      width: 120px; height: 90px;
      border: 2px solid rgba(124, 77, 255, 0.6);
      transform: scaleX(-1); opacity: 0.6; border-radius: 8px;
    }

    #error-log { display: none; position: absolute; top: 0; left: 0; color: red; background: rgba(0,0,0,0.8); z-index: 999; padding: 10px; }
  </style>
</head>
<body>
  <div id="error-log"></div>

  <div id="ui-layer">
    <div id="status" class="badge">🎂 SINH NHẬT VUI VẺ 🎂</div>
    <div class="guide">
      🖐 <b>Xòe:</b> Bung Bóng & Kim Tuyến &nbsp;|&nbsp;
      👌 <b>Pinch:</b> Xem ảnh &nbsp;|&nbsp;
      ✊ <b>Nắm:</b> Thu lại “bữa tiệc”
    </div>
    <button id="btnStart" onclick="startSystem()">BẮT ĐẦU TIỆC SINH NHẬT</button>
  </div>

  <div id="canvas-container"></div>
  <video class="input_video" style="display:none"></video>
  <canvas id="camera-preview"></canvas>

  <script>
    // ==========================================
    // 1) Birthday assets
    // ==========================================
    const MUSIC_URL = "./audio.mp3";
    let bgMusic = new Audio(MUSIC_URL);
    bgMusic.loop = true;
    bgMusic.volume = 1.0;

    const loader = new THREE.TextureLoader();
    const photoFiles = ['./image1.jpeg', './image2.jpeg', './image3.jpeg', './image4.jpeg', './image5.jpeg'];
    const photoTextures = [];
    photoFiles.forEach((f, i) => photoTextures[i] = loader.load(f));

    function createCustomTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const cx = 64, cy = 64;

      if (type === 'confetti_glow') {
        const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
        grd.addColorStop(0, '#FFFFFF');
        grd.addColorStop(0.25, '#B2FF59');
        grd.addColorStop(0.55, '#40C4FF');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);

      } else if (type === 'balloon_light') {
        const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
        grd.addColorStop(0, '#FFD1FF');
        grd.addColorStop(0.35, '#FF4081');
        grd.addColorStop(0.7, '#7C4DFF');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);

      } else if (type === 'cake_box') {
        // quà/cake box
        ctx.fillStyle = '#7C4DFF';
        ctx.fillRect(20, 20, 88, 88);

        ctx.fillStyle = '#FFEA00';
        ctx.fillRect(54, 20, 20, 88);
        ctx.fillRect(20, 54, 88, 20);

        // nến mini
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(58, 18, 4, 12);
        ctx.fillStyle = '#FF7043';
        ctx.fillRect(58, 14, 4, 4);

        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = 2;
        ctx.strokeRect(20,20,88,88);
      }
      return new THREE.CanvasTexture(canvas);
    }

    const textures = {
      gold: createCustomTexture('confetti_glow'),
      red: createCustomTexture('balloon_light'),
      gift: createCustomTexture('cake_box')
    };

    // ==========================================
    // 2) Config (Cake 3 tiers)
    // ==========================================
    const CONFIG = {
      goldCount: 2200,    // kim tuyến
      redCount: 420,      // bóng bay / đèn màu
      giftCount: 180,     // quà / hộp

      explodeRadius: 70,
      photoOrbitRadius: 26,

      // Bánh kem 3 tầng (tầng dưới -> trên)
      cake: {
        tierHeights: [18, 16, 14],
        tierRadii:   [30, 23, 16],
        gap: 1.5
      }
    };

    let scene, camera, renderer;
    let groupGold, groupRed, groupGift;
    let photoMeshes = [];
    let titleMesh, starMesh;

    let state = 'TREE';  // TREE=hiện bánh, EXPLODE=bung, PHOTO=xem ảnh
    let selectedIndex = 0;
    let handX = 0.5;

    // ==========================================
    // 3) 3D Init
    // ==========================================
    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.002);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.z = 100;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      groupGold = createParticleSystem('gold', CONFIG.goldCount, 2.0); // confetti
      groupRed  = createParticleSystem('red',  CONFIG.redCount,  3.8); // balloon lights
      groupGift = createParticleSystem('gift', CONFIG.giftCount, 3.0); // boxes

      createPhotos();
      createDecorations();
      animate();
    }

    function createParticleSystem(type, count, size) {
      const pPositions = [];
      const pExplodeTargets = [];
      const pCakeTargets = [];

      // Precompute cake total height
      const tierHeights = CONFIG.cake.tierHeights;
      const tierRadii   = CONFIG.cake.tierRadii;
      const gap         = CONFIG.cake.gap;

      const totalH = tierHeights.reduce((a,b)=>a+b,0) + gap * (tierHeights.length - 1);
      const heightWeightSum = tierHeights.reduce((a,b)=>a+b,0);

      for (let i = 0; i < count; i++) {

        // =============================
        // Cake (3 tiers) targets
        // =============================
        // pick a tier by height weight
        const rPick = Math.random() * heightWeightSum;
        let acc = 0, tier = 0;
        for (let t = 0; t < tierHeights.length; t++) {
          acc += tierHeights[t];
          if (rPick <= acc) { tier = t; break; }
        }

        // baseY of tier (from cake bottom)
        let baseY = 0;
        for (let t = 0; t < tier; t++) baseY += tierHeights[t] + gap;

        // random Y within tier, then center around 0
        const yInTier = Math.random() * tierHeights[tier];
        const y = (baseY + yInTier) - totalH / 2;

        // radius distribution inside cylinder
        const theta = Math.random() * Math.PI * 2;

        // bias per group for look
        let radiusBias = 1.0;
        if (type === 'red')  radiusBias = 0.85 + Math.random() * 0.15; // near edge
        if (type === 'gift') radiusBias = 0.7  + Math.random() * 0.3;  // slightly edge

        const r = tierRadii[tier] * Math.sqrt(Math.random()) * radiusBias;

        const tx = r * Math.cos(theta);
        const tz = r * Math.sin(theta);

        pCakeTargets.push(tx, y, tz);

        // =============================
        // Explode targets (sphere)
        // =============================
        const u = Math.random();
        const v = Math.random();
        const phi = Math.acos(2 * v - 1);
        const lam = 2 * Math.PI * u;

        let radMult = (type === 'gift') ? 1.25 : 1.0;
        const rad = CONFIG.explodeRadius * Math.cbrt(Math.random()) * radMult;

        const ex = rad * Math.sin(phi) * Math.cos(lam);
        const ey = rad * Math.sin(phi) * Math.sin(lam);
        const ez = rad * Math.cos(phi);
        pExplodeTargets.push(ex, ey, ez);

        // initial position = cake
        pPositions.push(tx, y, tz);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
      geo.userData = { cake: pCakeTargets, explode: pExplodeTargets };

      const mat = new THREE.PointsMaterial({
        size: size,
        map: textures[type],
        transparent: true,
        opacity: 1.0,
        blending: (type === 'gift') ? THREE.NormalBlending : THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return points;
    }

    function createPhotos() {
      const geo = new THREE.PlaneGeometry(8, 8);
      const borderGeo = new THREE.PlaneGeometry(9, 9);
      const borderMat = new THREE.MeshBasicMaterial({ color: 0xFFEA00 });

      for (let i = 0; i < 5; i++) {
        const mat = new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geo, mat);

        const border = new THREE.Mesh(borderGeo, borderMat);
        border.position.z = -0.1;
        mesh.add(border);

        mesh.visible = false;
        mesh.scale.set(0,0,0);
        scene.add(mesh);
        photoMeshes.push(mesh);
      }
    }

    function createDecorations() {
      // Title: HAPPY BIRTHDAY
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold italic 96px "Times New Roman"';
      ctx.fillStyle = '#FFEA00';
      ctx.textAlign = 'center';
      ctx.shadowColor = "#7C4DFF";
      ctx.shadowBlur = 45;
      ctx.fillText("HAPPY BIRTHDAY", 512, 140);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
      titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(70, 16), mat);
      titleMesh.position.set(0, 52, 0);
      scene.add(titleMesh);

      // Candle flame on top
      const flameCanvas = document.createElement('canvas');
      flameCanvas.width = 128; flameCanvas.height = 128;
      const fCtx = flameCanvas.getContext('2d');

      const g = fCtx.createRadialGradient(64, 70, 5, 64, 70, 55);
      g.addColorStop(0, "rgba(255, 255, 200, 1)");
      g.addColorStop(0.35, "rgba(255, 180, 0, 0.95)");
      g.addColorStop(1, "rgba(0, 0, 0, 0)");
      fCtx.fillStyle = g;
      fCtx.fillRect(0,0,128,128);

      fCtx.fillStyle = "#FFB300";
      fCtx.shadowColor = "#FFF";
      fCtx.shadowBlur = 25;
      fCtx.beginPath();
      fCtx.moveTo(64, 18);
      fCtx.bezierCurveTo(88, 42, 86, 76, 64, 92);
      fCtx.bezierCurveTo(42, 76, 40, 42, 64, 18);
      fCtx.closePath();
      fCtx.fill();

      const flameTex = new THREE.CanvasTexture(flameCanvas);
      const flameMat = new THREE.MeshBasicMaterial({ map: flameTex, transparent: true, blending: THREE.AdditiveBlending });

      // Put flame at cake top
      const totalH = CONFIG.cake.tierHeights.reduce((a,b)=>a+b,0) + CONFIG.cake.gap * (CONFIG.cake.tierHeights.length - 1);
      starMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), flameMat);
      starMesh.position.set(0, totalH/2 + 6, 0);
      scene.add(starMesh);
    }

    function updateParticleGroup(group, targetState, speed, handRotY, time, isBlinking) {
      const positions = group.geometry.attributes.position.array;

      const targets =
        (targetState === 'PHOTO')
          ? group.geometry.userData.explode
          : (targetState === 'TREE' ? group.geometry.userData.cake : group.geometry.userData.explode);

      for (let i = 0; i < positions.length; i++) {
        positions[i] += (targets[i] - positions[i]) * speed;
      }
      group.geometry.attributes.position.needsUpdate = true;

      if (targetState === 'TREE') {
        group.rotation.y += 0.003;
        if (isBlinking) {
          const scale = 1 + Math.sin(time * 5) * 0.22;
          group.scale.set(scale, scale, scale);
        } else {
          group.scale.set(1,1,1);
        }
      } else {
        group.scale.set(1,1,1);
        group.rotation.y += (handRotY - group.rotation.y) * 0.05;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;
      const speed = 0.06;
      const handRotY = (handX - 0.5) * 2.5;

      updateParticleGroup(groupGold, state, speed, handRotY, time, false);
      updateParticleGroup(groupRed,  state, speed, handRotY, time, true);
      updateParticleGroup(groupGift, state, speed, handRotY, time, false);

      photoMeshes.forEach((mesh, i) => {
        if (!mesh.material.map && photoTextures[i]) {
          mesh.material.map = photoTextures[i];
          mesh.material.needsUpdate = true;
        }
      });

      if (state === 'TREE') {
        titleMesh.visible = true; starMesh.visible = true;
        titleMesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
        starMesh.rotation.z -= 0.03;
        photoMeshes.forEach(m => { m.scale.lerp(new THREE.Vector3(0,0,0), 0.1); m.visible = false; });

      } else if (state === 'EXPLODE') {
        titleMesh.visible = false; starMesh.visible = false;

        const baseAngle = groupGold.rotation.y;
        const angleStep = (Math.PI * 2) / 5;
        let bestIdx = 0; let maxZ = -999;

        photoMeshes.forEach((mesh, i) => {
          mesh.visible = true;
          const angle = baseAngle + i * angleStep;
          const x = Math.sin(angle) * CONFIG.photoOrbitRadius;
          const z = Math.cos(angle) * CONFIG.photoOrbitRadius;
          const y = Math.sin(time + i) * 3;

          mesh.position.lerp(new THREE.Vector3(x, y, z), 0.1);
          mesh.lookAt(camera.position);

          if (z > maxZ) { maxZ = z; bestIdx = i; }

          if (z > 5) {
            const distScale = 1.0 + (z / CONFIG.photoOrbitRadius) * 0.8;
            mesh.scale.lerp(new THREE.Vector3(distScale, distScale, distScale), 0.1);
          } else {
            mesh.scale.lerp(new THREE.Vector3(0.6, 0.6, 0.6), 0.1);
          }
        });
        selectedIndex = bestIdx;

      } else if (state === 'PHOTO') {
        photoMeshes.forEach((mesh, i) => {
          if (i === selectedIndex) {
            mesh.position.lerp(new THREE.Vector3(0, 0, 60), 0.1);
            mesh.scale.lerp(new THREE.Vector3(5, 5, 5), 0.1);
            mesh.lookAt(camera.position);
            mesh.rotation.z = 0;
          } else {
            mesh.scale.lerp(new THREE.Vector3(0,0,0), 0.1);
          }
        });
      }

      renderer.render(scene, camera);
    }

    // ==========================================
    // 4) Start + Hand Tracking
    // ==========================================
    function startSystem() {
      document.getElementById('btnStart').style.display = 'none';
      bgMusic.play().catch(e => console.log(e));
      init3D();

      const video = document.getElementsByClassName('input_video')[0];
      const canvas = document.getElementById('camera-preview');
      const ctx = canvas.getContext('2d');
      const statusDiv = document.getElementById('status');

      let frameCnt = 0;
      const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

      hands.onResults(results => {
        ctx.clearRect(0,0,100,75);
        ctx.drawImage(results.image, 0, 0, 100, 75);

        if (results.multiHandLandmarks.length > 0) {
          const lm = results.multiHandLandmarks[0];
          handX = lm[9].x;

          const tips = [8,12,16,20];
          const wrist = lm[0];
          let openDist = 0;
          tips.forEach(i => openDist += Math.hypot(lm[i].x-wrist.x, lm[i].y-wrist.y));
          const avgDist = openDist / 4;
          const pinchDist = Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y);

          if (avgDist < 0.25) {
            state = 'TREE';
            statusDiv.innerText = "✊ Thu lại bữa tiệc";
            statusDiv.style.color = "#7CFFCB";
          } else if (pinchDist < 0.05) {
            state = 'PHOTO';
            statusDiv.innerText = "👌 Xem ảnh kỷ niệm";
            statusDiv.style.color = "#40C4FF";
          } else {
            state = 'EXPLODE';
            statusDiv.innerText = "🖐 Bung bóng & kim tuyến";
            statusDiv.style.color = "#FFEA00";
          }
        } else {
          state = 'TREE';
          statusDiv.innerText = "🎂 SINH NHẬT VUI VẺ 🎂";
          statusDiv.style.color = "#FFF";
        }
      });

      const cameraUtils = new Camera(video, {
        onFrame: async () => {
          frameCnt++; if (frameCnt % 3 !== 0) return;
          await hands.send({ image: video });
        },
        width: 320, height: 240
      });
      cameraUtils.start();
    }

    window.addEventListener('resize', () => {
      if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    function logError(e) {
      document.getElementById('error-log').style.display = 'block';
      document.getElementById('error-log').innerText += e + "\n";
    }
  </script>
</body>
</html>

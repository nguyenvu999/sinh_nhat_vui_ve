<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Birthday - Interactive Celebration</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        
        /* UI Layer */
        #ui-layer {
            position: absolute; bottom: 40px; width: 100%;
            text-align: center; pointer-events: none; z-index: 100;
        }
        
        .guide { 
            color: rgba(255, 255, 255, 0.8); 
            font-size: 14px; 
            margin-bottom: 25px; 
            text-shadow: 0 0 10px #ff00ff;
            letter-spacing: 1px;
        }

        button {
            pointer-events: auto; cursor: pointer;
            background: linear-gradient(45deg, #FF1493, #8A2BE2); 
            color: #FFF; border: 2px solid #00FFFF;
            padding: 15px 45px; border-radius: 50px; 
            font-weight: 800; font-size: 18px;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.7);
            transition: 0.3s;
            text-transform: uppercase;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(0, 255, 255, 0.8); }

        #camera-preview {
            position: absolute; top: 20px; left: 20px;
            width: 140px; height: 105px;
            border: 2px solid #FF1493; 
            transform: scaleX(-1); opacity: 0.7; border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.3);
        }
        
        #copyright {
            position: absolute; bottom: 15px; right: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px; z-index: 100; font-style: italic;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="guide">
            🖐 <b>Xòe tay:</b> Pháo hoa & Bong bóng &nbsp;|&nbsp; 🫶 <b>Trái tim:</b> Yêu thương &nbsp;|&nbsp; ✊ <b>Nắm tay:</b> Bánh kem
        </div>
        <button id="btnStart" onclick="startSystem()">BẮT ĐẦU BUỔI TIỆC</button>
    </div>

    <div id="copyright">© Birthday Magic by vandiep</div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none"></video>
    <canvas id="camera-preview"></canvas>

    <script>
        // ==========================================
        // 1. CẤU HÌNH TÀI NGUYÊN
        // ==========================================
        const MUSIC_URL = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; // Có thể thay bằng link nhạc Happy Birthday
        let bgMusic = new Audio(MUSIC_URL);
        bgMusic.loop = true;

        const loader = new THREE.TextureLoader();
        // Giữ nguyên logic load ảnh cá nhân
        const photoFiles = ['./image1.jpeg', './image2.jpeg', './image3.jpeg', './image4.jpeg', './image5.jpeg'];
        const photoTextures = [];
        photoFiles.forEach((f, i) => photoTextures[i] = loader.load(f));

        function createCustomTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            if (type === 'neon_dot') {
                const grd = ctx.createRadialGradient(64, 64, 0, 64, 64, 60);
                grd.addColorStop(0, '#FFFFFF'); 
                grd.addColorStop(0.3, '#FF1493'); 
                grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
            } else if (type === 'balloon') {
                ctx.beginPath();
                ctx.ellipse(64, 55, 40, 50, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#00FFFF'; ctx.fill();
                ctx.beginPath(); ctx.moveTo(64, 105); ctx.lineTo(60, 120); ctx.lineTo(68, 120); ctx.fill();
            } else if (type === 'confetti') {
                ctx.fillStyle = '#FFD700'; ctx.fillRect(30, 30, 60, 60);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const textures = {
            main: createCustomTexture('neon_dot'),
            balloon: createCustomTexture('balloon'),
            confetti: createCustomTexture('confetti')
        };

        // ==========================================
        // 2. CẤU HÌNH HỆ THỐNG
        // ==========================================
        const CONFIG = {
            particleCount: 2500,
            cakeRadius: 25,
            cakeHeight: 40,
            explodeRadius: 70
        };

        let scene, camera, renderer, groupMain, groupBalloon, groupConfetti;
        let photoMeshes = []; let titleMesh, candleMesh, loveMesh;
        let state = 'CAKE'; let handX = 0.5; let selectedIndex = 0;

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 120;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Tạo các nhóm hạt
            groupMain = createParticleSystem('main', CONFIG.particleCount, 1.5);
            groupBalloon = createParticleSystem('balloon', 200, 4.0);
            groupConfetti = createParticleSystem('confetti', 400, 2.0);

            createPhotos();
            createDecorations();
            animate();
        }

        function createParticleSystem(type, count, size) {
            const positions = [], cakeTargets = [], explodeTargets = [], heartTargets = [];
            const colors = new Float32Array(count * 3);
            const colorObj = new THREE.Color();

            for(let i=0; i<count; i++) {
                // --- CAKE TARGET (Hình trụ 3 tầng) ---
                const layer = Math.floor(Math.random() * 3);
                const h = (layer * 12) + (Math.random() * 10) - 20;
                const r = CONFIG.cakeRadius - (layer * 5);
                const theta = Math.random() * Math.PI * 2;
                cakeTargets.push(r * Math.cos(theta), h, r * Math.sin(theta));

                // --- EXPLODE TARGET ---
                const phi = Math.acos(2 * Math.random() - 1);
                const lam = 2 * Math.PI * Math.random();
                const rad = CONFIG.explodeRadius * Math.cbrt(Math.random());
                explodeTargets.push(rad * Math.sin(phi) * Math.cos(lam), rad * Math.sin(phi) * Math.sin(lam), rad * Math.cos(phi));

                // --- HEART TARGET ---
                const t = Math.random() * Math.PI * 2;
                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const rFill = Math.pow(Math.random(), 0.5);
                heartTargets.push(hx * rFill * 2.5, hy * rFill * 2.5, (Math.random()-0.5)*10);

                positions.push(cakeTargets[i*3], cakeTargets[i*3+1], cakeTargets[i*3+2]);
                
                // Đa sắc cho sinh nhật
                const hue = (type === 'main') ? (0.8 + Math.random() * 0.2) : Math.random();
                colorObj.setHSL(hue, 0.8, 0.6);
                colors[i*3] = colorObj.r; colors[i*3+1] = colorObj.g; colors[i*3+2] = colorObj.b;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.userData = { cake: cakeTargets, explode: explodeTargets, heart: heartTargets };

            const mat = new THREE.PointsMaterial({
                size: size, map: textures[type === 'main' ? 'main' : (type === 'balloon' ? 'balloon' : 'confetti')],
                transparent: true, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            return points;
        }

        function createDecorations() {
            // Text HAPPY BIRTHDAY
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 100px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00FFFF';
            ctx.shadowColor = '#FF1493'; ctx.shadowBlur = 30;
            ctx.fillText("HAPPY BIRTHDAY", 512, 140);
            
            const tex = new THREE.CanvasTexture(canvas);
            titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(80, 20), new THREE.MeshBasicMaterial({map: tex, transparent: true}));
            titleMesh.position.y = 40;
            scene.add(titleMesh);

            // Nến (Thay cho ngôi sao)
            const cGeo = new THREE.CylinderGeometry(1, 1, 10);
            const cMat = new THREE.MeshBasicMaterial({color: 0xFFFF00});
            candleMesh = new THREE.Mesh(cGeo, cMat);
            candleMesh.position.y = 5;
            scene.add(candleMesh);

            // Love Text
            const lCanvas = document.createElement('canvas');
            lCanvas.width = 512; lCanvas.height = 128;
            const lCtx = lCanvas.getContext('2d');
            lCtx.font = 'bold 50px Arial'; lCtx.fillStyle = '#FF69B4'; lCtx.textAlign = 'center';
            lCtx.fillText("CHÚC MỪNG SINH NHẬT ❤️", 256, 70);
            loveMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 15), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(lCanvas), transparent: true}));
            loveMesh.visible = false;
            scene.add(loveMesh);
        }

        function createPhotos() {
            const geo = new THREE.PlaneGeometry(10, 10);
            photoFiles.forEach((f, i) => {
                const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide }));
                mesh.visible = false;
                scene.add(mesh);
                photoMeshes.push(mesh);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const speed = 0.08;

            // Logic chuyển đổi vị trí hạt
            [groupMain, groupBalloon, groupConfetti].forEach(g => {
                const pos = g.geometry.attributes.position.array;
                const targets = (state === 'HEART') ? g.geometry.userData.heart : 
                                (state === 'CAKE' ? g.geometry.userData.cake : g.geometry.userData.explode);
                
                for(let i=0; i<pos.length; i++) {
                    pos[i] += (targets[i] - pos[i]) * speed;
                }
                g.geometry.attributes.position.needsUpdate = true;
                g.rotation.y += 0.005;
            });

            // Hiển thị UI theo State
            if(state === 'CAKE') {
                titleMesh.visible = true; candleMesh.visible = true; loveMesh.visible = false;
                photoMeshes.forEach(m => m.visible = false);
            } else if(state === 'EXPLODE') {
                titleMesh.visible = false; candleMesh.visible = false;
                photoMeshes.forEach((m, i) => {
                    m.visible = true;
                    const angle = (time + i * (Math.PI*2/5));
                    m.position.set(Math.cos(angle)*40, Math.sin(time+i)*5, Math.sin(angle)*40);
                    m.lookAt(camera.position);
                });
            } else if(state === 'HEART') {
                loveMesh.visible = true; titleMesh.visible = false; candleMesh.visible = false;
            }

            renderer.render(scene, camera);
        }

        // ==========================================
        // 3. MEDIA PIPE & CAMERA
        // ==========================================
        async function startSystem() {
            document.getElementById('btnStart').style.display = 'none';
            bgMusic.play();
            init3D();

            const video = document.getElementsByClassName('input_video')[0];
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6 });
            hands.onResults(results => {
                if (results.multiHandLandmarks.length === 2) {
                    state = 'HEART';
                } else if (results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const isOpen = Math.hypot(lm[8].x - lm[0].x, lm[8].y - lm[0].y) > 0.3;
                    state = isOpen ? 'EXPLODE' : 'CAKE';
                } else {
                    state = 'CAKE';
                }
            });

            const cameraUtils = new Camera(video, {
                onFrame: async () => { await hands.send({image: video}); },
                width: 640, height: 480
            });
            cameraUtils.start();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

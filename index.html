<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Birthday - Final Clean</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
    #canvas-container { width: 100%; height: 100vh; display: block; }

    #ui-layer {
      position: absolute; bottom: 30px; width: 100%;
      text-align: center; pointer-events: none; z-index: 100;
    }
    .guide {
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px black;
    }

    button {
      pointer-events: auto; cursor: pointer;
      background: linear-gradient(to bottom, #D32F2F, #8B0000);
      color: #FFF; border: 2px solid #FFD700;
      padding: 15px 50px; border-radius: 30px;
      font-weight: 800; font-size: 16px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    #camera-preview {
      position: absolute; top: 15px; right: 15px;
      width: 120px; height: 90px;
      border: 2px solid rgba(255,0,0,0.5);
      transform: scaleX(-1); opacity: 0.6; border-radius: 8px;
    }

    #copyright {
      position: absolute;
      bottom: 10px;
      right: 15px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      z-index: 100;
      font-family: sans-serif;
      pointer-events: none;
      font-style: italic;
    }

    #error-log { display: none; position: absolute; top: 0; left: 0; color: red; background: rgba(0,0,0,0.8); z-index: 999; padding: 10px; }
  </style>
</head>
<body>
  <div id="error-log"></div>

  <div id="ui-layer">
    <div class="guide">
      🖐 <b>Mở tay:</b> Pháo hoa + Ảnh người yêu &nbsp;|&nbsp;
      🫶 <b>Trái tim:</b> Lời chúc &nbsp;|&nbsp;
      ✊ <b>Nắm tay:</b> Bánh sinh nhật &nbsp;|&nbsp;
      🤏 <b>Chụm:</b> Phóng ảnh
    </div>
    <button id="btnStart" onclick="startSystem()">START BIRTHDAY</button>
  </div>

  <div id="copyright">© by vandiep</div>

  <div id="canvas-container"></div>
  <video class="input_video" style="display:none"></video>
  <canvas id="camera-preview"></canvas>

  <script>
    // ==========================================
    // 1) RESOURCES
    // ==========================================
    const MUSIC_URL = "./audio.mp3";
    let bgMusic = new Audio(MUSIC_URL);
    bgMusic.loop = true; bgMusic.volume = 1.0;

    // Ảnh người yêu (đổi tên file theo bạn)
    const LOVER_PHOTO_URL = "./lover.jpeg";

    const loader = new THREE.TextureLoader();
    const photoFiles = ['./image1.jpeg', './image2.jpeg', './image3.jpeg', './image4.jpeg', './image5.jpeg'];
    const photoTextures = [];
    photoFiles.forEach((f, i) => photoTextures[i] = loader.load(f));

    const loverTexture = loader.load(LOVER_PHOTO_URL);

    function createCustomTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const cx = 64, cy = 64;

      if (type === 'gold_glow') {
        const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
        grd.addColorStop(0, '#FFFFFF');
        grd.addColorStop(0.2, '#FFFFE0');
        grd.addColorStop(0.5, '#FFD700');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
      } else if (type === 'red_light') {
        const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
        grd.addColorStop(0, '#FFAAAA');
        grd.addColorStop(0.3, '#FF0000');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
      } else if (type === 'confetti') {
        // confetti: random colorful square
        ctx.fillStyle = `hsl(${Math.floor(Math.random()*360)}, 90%, 60%)`;
        ctx.fillRect(16, 16, 96, 96);
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 3;
        ctx.strokeRect(16, 16, 96, 96);
      }
      return new THREE.CanvasTexture(canvas);
    }

    const textures = {
      gold: createCustomTexture('gold_glow'),
      red: createCustomTexture('red_light'),
      confetti: createCustomTexture('confetti')
    };

    // ==========================================
    // 2) CONFIG
    // ==========================================
    const CONFIG = {
      goldCount: 2200,
      redCount: 400,
      confettiCount: 900,

      explodeRadius: 70,
      photoOrbitRadius: 26,

      // CAKE
      cakeHeight: 40,
      cakeRadius: 32,
      cakeTiers: 3,
      cakeTierHeight: 12,
      cakeTierGap: 1.5,

      // CANDLES
      candleCount: 10,

      // BALLOONS
      balloonCount: 14,

      // FIREWORKS
      fireworksBurstCount: 280,
      fireworksCooldownMs: 800
    };

    let scene, camera, renderer;
    let groupGold, groupRed, groupConfetti;
    let photoMeshes = [];
    let titleMesh, starMesh, loveMesh;

    // birthday extras
    let cakeCandles = [];
    let balloonGroup;
    let fireworksGroup = null;
    let lastFireworkAt = 0;

    // LOVER IMAGE POPUP
    let loverMesh;

    let state = 'TREE'; // TREE = cake shape
    let selectedIndex = 0;
    let handX = 0.5;

    // ==========================================
    // 3) THREE INIT
    // ==========================================
    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.002);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.z = 100;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Particles
      groupGold = createParticleSystem('gold', CONFIG.goldCount, 2.0);
      groupRed = createParticleSystem('red', CONFIG.redCount, 3.5);
      groupConfetti = createParticleSystem('confetti', CONFIG.confettiCount, 2.6);

      createPhotos();
      createDecorations();
      createCandles();
      createBalloons();
      createLoverPopup();

      animate();
    }

    function createParticleSystem(type, count, size) {
      const pPositions = [];
      const pExplodeTargets = [];
      const pCakeTargets = [];
      const pHeartTargets = [];
      const sizes = [];
      const phases = [];

      for(let i=0; i<count; i++) {
        // --- CAKE (3 tiers) ---
        const tier = Math.floor(Math.random() * CONFIG.cakeTiers);
        const tierRadius = CONFIG.cakeRadius * (1 - tier * 0.22);
        const tierY0 =
          -CONFIG.cakeHeight / 2 +
          tier * (CONFIG.cakeTierHeight + CONFIG.cakeTierGap);

        const y = tierY0 + Math.random() * CONFIG.cakeTierHeight;
        const rr = Math.sqrt(Math.random()) * tierRadius;
        const theta = Math.random() * Math.PI * 2;
        pCakeTargets.push(rr * Math.cos(theta), y, rr * Math.sin(theta));

        // --- EXPLODE ---
        const u = Math.random();
        const v = Math.random();
        const phi = Math.acos(2 * v - 1);
        const lam = 2 * Math.PI * u;
        const rad = CONFIG.explodeRadius * Math.cbrt(Math.random());
        pExplodeTargets.push(
          rad * Math.sin(phi) * Math.cos(lam),
          rad * Math.sin(phi) * Math.sin(lam),
          rad * Math.cos(phi)
        );

        // --- HEART (soft fill) ---
        const tHeart = Math.random() * Math.PI * 2;
        let hx = 16 * Math.pow(Math.sin(tHeart), 3);
        let hy = 13 * Math.cos(tHeart) - 5 * Math.cos(2*tHeart) - 2 * Math.cos(3*tHeart) - Math.cos(4*tHeart);
        const rFill = Math.pow(Math.random(), 0.3);
        hx *= rFill; hy *= rFill;
        let hz = (Math.random() - 0.5) * 8 * rFill;

        const noise = 1.0;
        hx += (Math.random() - 0.5) * noise;
        hy += (Math.random() - 0.5) * noise;
        hz += (Math.random() - 0.5) * noise;

        const scaleH = 2.2;
        pHeartTargets.push(hx * scaleH, hy * scaleH + 5, hz);

        // INIT
        pPositions.push(pCakeTargets[i*3], pCakeTargets[i*3+1], pCakeTargets[i*3+2]);
        sizes.push(size);
        phases.push(Math.random() * Math.PI * 2);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
      geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

      // Colors
      const colors = new Float32Array(count * 3);
      const baseColor = new THREE.Color();

      if(type === 'gold') baseColor.setHex(0xFFD700);
      else if(type === 'red') baseColor.setHex(0xFF0000);
      else baseColor.setHSL(Math.random(), 1, 0.7); // confetti base

      for(let i=0; i<count; i++) {
        if (type === 'confetti') {
          const c = new THREE.Color().setHSL(Math.random(), 1, 0.65);
          colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
        } else {
          colors[i*3] = baseColor.r;
          colors[i*3+1] = baseColor.g;
          colors[i*3+2] = baseColor.b;
        }
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      geo.userData = {
        cake: pCakeTargets,
        explode: pExplodeTargets,
        heart: pHeartTargets,
        phases: phases,
        baseColor: baseColor,
        baseSize: size
      };

      const mat = new THREE.PointsMaterial({
        size: size,
        map: (type === 'confetti') ? textures.confetti : textures[type],
        transparent: true, opacity: 1.0,
        vertexColors: true,
        blending: (type === 'confetti') ? THREE.NormalBlending : THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return points;
    }

    function createPhotos() {
      const geo = new THREE.PlaneGeometry(8, 8);
      const borderGeo = new THREE.PlaneGeometry(9, 9);
      const borderMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });

      for(let i=0; i<5; i++) {
        const mat = new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geo, mat);
        const border = new THREE.Mesh(borderGeo, borderMat);
        border.position.z = -0.1;
        mesh.add(border);
        mesh.visible = false; mesh.scale.set(0,0,0);
        scene.add(mesh);
        photoMeshes.push(mesh);
      }
    }

    function createDecorations() {
      // HAPPY BIRTHDAY TEXT
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0,0,1024,256);
      ctx.textAlign = 'center';
      ctx.font = '900 96px "Segoe UI", sans-serif';
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.shadowColor = "#FF2D95";
      ctx.shadowBlur = 45;
      ctx.strokeText("HAPPY BIRTHDAY", 512, 140);

      ctx.fillStyle = '#FFD700';
      ctx.shadowColor = "#FF0066";
      ctx.shadowBlur = 50;
      ctx.fillText("HAPPY BIRTHDAY", 512, 140);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
      titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(70, 16), mat);
      titleMesh.position.set(0, 46, 0);
      scene.add(titleMesh);

      // "CANDLE GLOW" (reuse star slot)
      const starCanvas = document.createElement('canvas');
      starCanvas.width = 128; starCanvas.height = 128;
      const sCtx = starCanvas.getContext('2d');
      const grd = sCtx.createRadialGradient(64, 64, 0, 64, 64, 55);
      grd.addColorStop(0, 'rgba(255,255,210,1)');
      grd.addColorStop(0.35, 'rgba(255,170,0,0.95)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      sCtx.fillStyle = grd;
      sCtx.fillRect(0,0,128,128);

      const starTex = new THREE.CanvasTexture(starCanvas);
      const starMat = new THREE.MeshBasicMaterial({ map: starTex, transparent: true, blending: THREE.AdditiveBlending });
      starMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), starMat);
      starMesh.position.set(0, CONFIG.cakeHeight/2 + 10, 0);
      scene.add(starMesh);

      // WISH TEXT
      const loveCanvas = document.createElement('canvas');
      loveCanvas.width = 1024; loveCanvas.height = 256;
      const lCtx = loveCanvas.getContext('2d');
      lCtx.font = '900 110px "Segoe UI", sans-serif';
      lCtx.fillStyle = '#FF69B4'; lCtx.textAlign = 'center';
      lCtx.shadowColor = "#FF1493"; lCtx.shadowBlur = 40;
      lCtx.fillText("CHÚC MỪNG SINH NHẬT 🎂", 512, 140);

      const loveTex = new THREE.CanvasTexture(loveCanvas);
      const loveMat = new THREE.MeshBasicMaterial({ map: loveTex, transparent: true, blending: THREE.AdditiveBlending });
      loveMesh = new THREE.Mesh(new THREE.PlaneGeometry(80, 20), loveMat);
      loveMesh.position.set(0, 0, 20);
      loveMesh.visible = false;
      scene.add(loveMesh);
    }

    // ==========================================
    // CANDLES + FLAME
    // ==========================================
    function createCandleTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const g = c.getContext('2d');
      g.fillStyle = '#FFFFFF'; g.fillRect(0,0,64,64);
      g.fillStyle = '#FF4D4D'; g.fillRect(26,0,12,64);
      return new THREE.CanvasTexture(c);
    }

    function createFlameTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(64, 72, 0, 64, 72, 46);
      grd.addColorStop(0, 'rgba(255,255,200,1)');
      grd.addColorStop(0.25, 'rgba(255,180,0,0.95)');
      grd.addColorStop(0.55, 'rgba(255,80,0,0.65)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.ellipse(64, 72, 24, 44, 0, 0, Math.PI*2);
      g.fill();
      return new THREE.CanvasTexture(c);
    }

    function createCandles() {
      const candleTex = createCandleTexture();
      const flameTex = createFlameTexture();

      for (let i=0; i<CONFIG.candleCount; i++) {
        const candle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.5, 0.5, 6, 10),
          new THREE.MeshBasicMaterial({ map: candleTex })
        );

        const topTierRadius = CONFIG.cakeRadius * (1 - (CONFIG.cakeTiers-1)*0.22);
        const r = (0.2 + Math.random()*0.75) * topTierRadius;
        const a = Math.random() * Math.PI * 2;
        candle.position.set(Math.cos(a)*r, CONFIG.cakeHeight/2 - 2, Math.sin(a)*r);

        const flame = new THREE.Mesh(
          new THREE.PlaneGeometry(3, 4),
          new THREE.MeshBasicMaterial({
            map: flameTex,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        flame.position.set(0, 4.2, 0);
        candle.add(flame);

        scene.add(candle);
        cakeCandles.push({ candle, flame, phase: Math.random()*Math.PI*2 });
      }
    }

    // ==========================================
    // BALLOONS
    // ==========================================
    function createBalloons() {
      balloonGroup = new THREE.Group();

      for (let i=0; i<CONFIG.balloonCount; i++) {
        const balloon = new THREE.Mesh(
          new THREE.SphereGeometry(2.3, 18, 18),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
        );
        balloon.material.color.setHSL(Math.random(), 0.8, 0.7);

        const radius = 55 + Math.random()*35;
        const a = Math.random()*Math.PI*2;
        balloon.position.set(Math.cos(a)*radius, -10 + Math.random()*60, Math.sin(a)*radius);

        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, -2.5, 0),
          new THREE.Vector3(0, -12 - Math.random()*10, 0)
        ]);
        const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ transparent: true, opacity: 0.35 }));
        balloon.add(line);

        balloon.userData = { phase: Math.random()*Math.PI*2, baseY: balloon.position.y };
        balloonGroup.add(balloon);
      }
      scene.add(balloonGroup);
    }

    // ==========================================
    // LOVER POPUP (show when OPEN hand)
    // ==========================================
    function createLoverPopup() {
      // plane dạng "poster" ở giữa, có viền vàng, hơi glow
      const borderCanvas = document.createElement('canvas');
      borderCanvas.width = 512; borderCanvas.height = 512;
      const b = borderCanvas.getContext('2d');

      // nền trong suốt
      b.clearRect(0,0,512,512);

      // viền
      b.strokeStyle = 'rgba(255,215,0,0.95)';
      b.lineWidth = 18;
      b.shadowColor = 'rgba(255,0,120,0.65)';
      b.shadowBlur = 30;
      b.strokeRect(20, 20, 472, 472);

      const borderTex = new THREE.CanvasTexture(borderCanvas);

      const group = new THREE.Group();

      const photoMat = new THREE.MeshBasicMaterial({ map: loverTexture, transparent: true });
      const photo = new THREE.Mesh(new THREE.PlaneGeometry(28, 28), photoMat);

      const frameMat = new THREE.MeshBasicMaterial({
        map: borderTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.95
      });
      const frame = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), frameMat);
      frame.position.z = 0.05;

      group.add(photo);
      group.add(frame);

      group.position.set(0, 0, 55);
      group.visible = false;
      group.scale.set(0.01, 0.01, 0.01);

      loverMesh = group;
      scene.add(loverMesh);
    }

    function showLoverPopup() {
      if (!loverMesh) return;
      loverMesh.visible = true;
      // bật nhanh (animate trong loop)
      loverMesh.userData.showing = true;
      loverMesh.userData.lastShowAt = performance.now();
    }

    function updateLoverPopup(time) {
      if (!loverMesh) return;

      // chỉ show trong EXPLODE (mở tay). Các state khác tắt.
      if (state !== 'EXPLODE') {
        loverMesh.visible = false;
        loverMesh.scale.lerp(new THREE.Vector3(0.01,0.01,0.01), 0.12);
        loverMesh.userData.showing = false;
        return;
      }

      // đang EXPLODE: hiện ảnh và “thở” nhẹ
      loverMesh.visible = true;
      const pulse = 1 + 0.03 * Math.sin(time * 3.5);
      const targetScale = new THREE.Vector3(1.2 * pulse, 1.2 * pulse, 1);
      loverMesh.scale.lerp(targetScale, 0.08);

      loverMesh.lookAt(camera.position);
    }

    // ==========================================
    // FIREWORKS
    // ==========================================
    function spawnFireworks() {
      if (fireworksGroup) {
        scene.remove(fireworksGroup);
        fireworksGroup.geometry.dispose();
        fireworksGroup.material.dispose();
        fireworksGroup = null;
      }

      const count = CONFIG.fireworksBurstCount;
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);

      const center = new THREE.Vector3(
        (Math.random()-0.5)*30,
        10 + Math.random()*25,
        (Math.random()-0.5)*30
      );

      for (let i=0; i<count; i++) {
        const u = Math.random(), v = Math.random();
        const phi = Math.acos(2*v - 1);
        const lam = 2*Math.PI*u;
        const rad = 1.5 + Math.random()*20;

        pos[i*3]   = center.x + rad * Math.sin(phi)*Math.cos(lam);
        pos[i*3+1] = center.y + rad * Math.sin(phi)*Math.sin(lam);
        pos[i*3+2] = center.z + rad * Math.cos(phi);

        const c = new THREE.Color().setHSL(Math.random(), 1, 0.65);
        col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      geo.userData = { born: performance.now() };

      const mat = new THREE.PointsMaterial({
        size: 2.3,
        transparent: true,
        opacity: 1,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      fireworksGroup = new THREE.Points(geo, mat);
      scene.add(fireworksGroup);
    }

    function updateFireworks() {
      if (!fireworksGroup) return;
      const age = performance.now() - fireworksGroup.geometry.userData.born;
      const t = age / 900;
      fireworksGroup.material.opacity = Math.max(0, 1 - t);

      if (t >= 1) {
        scene.remove(fireworksGroup);
        fireworksGroup.geometry.dispose();
        fireworksGroup.material.dispose();
        fireworksGroup = null;
      }
    }

    // ==========================================
    // UPDATE PARTICLES
    // ==========================================
    function updateParticleGroup(group, type, targetState, speed, handRotY, time) {
      const positions = group.geometry.attributes.position.array;
      const sizes = group.geometry.attributes.size.array;
      const colors = group.geometry.attributes.color.array;
      const phases = group.geometry.userData.phases;
      const baseColor = group.geometry.userData.baseColor;
      const baseSize = group.geometry.userData.baseSize;

      const targetKey = (targetState === 'TREE') ? 'cake' : (targetState === 'HEART' ? 'heart' : 'explode');
      const targets = group.geometry.userData[(targetState === 'PHOTO') ? 'explode' : targetKey];

      // lerp positions
      for(let i=0; i<positions.length; i++) {
        positions[i] += (targets[i] - positions[i]) * speed;
      }
      group.geometry.attributes.position.needsUpdate = true;

      const count = positions.length / 3;

      if (targetState === 'TREE') {
        group.rotation.y += 0.003;

        for(let i=0; i<count; i++) {
          sizes[i] = baseSize;

          let brightness = 1.0;
          if(type === 'red') brightness = 0.55 + 0.45 * Math.sin(time * 3 + phases[i]);
          else if(type === 'gold') brightness = 0.85 + 0.35 * Math.sin(time * 10 + phases[i]);
          else brightness = 0.85; // confetti subdued on cake

          if (type === 'confetti') {
            // confetti giữ màu, chỉ nhấp nháy nhẹ opacity qua size
            sizes[i] = baseSize * (0.7 + 0.3*Math.abs(Math.sin(time*4 + phases[i])));
          } else {
            colors[i*3]   = baseColor.r * brightness;
            colors[i*3+1] = baseColor.g * brightness;
            colors[i*3+2] = baseColor.b * brightness;
          }
        }
        group.geometry.attributes.color.needsUpdate = true;
        group.geometry.attributes.size.needsUpdate = true;

      } else if (targetState === 'HEART') {
        group.rotation.y = 0;
        const beatScale = 1 + Math.abs(Math.sin(time * 3)) * 0.15;
        group.scale.set(beatScale, beatScale, beatScale);

        for(let i=0; i<count; i++) {
          if (type !== 'confetti') {
            colors[i*3] = baseColor.r; colors[i*3+1] = baseColor.g; colors[i*3+2] = baseColor.b;
          }
          if (i % 3 === 0) sizes[i] = baseSize;
          else sizes[i] = 0;
        }
        group.geometry.attributes.color.needsUpdate = true;
        group.geometry.attributes.size.needsUpdate = true;

      } else {
        // EXPLODE
        group.scale.set(1,1,1);
        group.rotation.y += (handRotY - group.rotation.y) * 0.1;

        for(let i=0; i<count; i++) {
          sizes[i] = baseSize;

          if(type === 'confetti') {
            // confetti bay vui hơn
            sizes[i] = baseSize * (0.9 + 0.5*Math.abs(Math.sin(time*7 + phases[i])));
          } else {
            let brightness = 0.85 + 0.5 * Math.sin(time * 12 + phases[i]);
            colors[i*3]   = baseColor.r * brightness;
            colors[i*3+1] = baseColor.g * brightness;
            colors[i*3+2] = baseColor.b * brightness;
          }
        }
        group.geometry.attributes.size.needsUpdate = true;
        group.geometry.attributes.color.needsUpdate = true;
      }
    }

    // ==========================================
    // ANIMATE
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;
      const speed = 0.08;
      const handRotY = (handX - 0.5) * 4.0;

      updateParticleGroup(groupGold, 'gold', state, speed, handRotY, time);
      updateParticleGroup(groupRed, 'red', state, speed, handRotY, time);
      updateParticleGroup(groupConfetti, 'confetti', state, speed, handRotY, time);

      // ensure photo maps loaded
      photoMeshes.forEach((mesh, i) => {
        if(!mesh.material.map && photoTextures[i]) {
          mesh.material.map = photoTextures[i]; mesh.material.needsUpdate = true;
        }
      });

      // UI/objects per state
      if (state === 'TREE') {
        titleMesh.visible = true; starMesh.visible = true; loveMesh.visible = false;

        titleMesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
        starMesh.material.opacity = 0.65 + 0.35*Math.sin(time*5);

        // hide photos
        photoMeshes.forEach(m => { m.scale.lerp(new THREE.Vector3(0,0,0), 0.1); m.visible = false; });

      } else if (state === 'HEART') {
        titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = true;
        photoMeshes.forEach(m => { m.visible = false; });

        const s = 1 + Math.abs(Math.sin(time*3))*0.1;
        loveMesh.scale.set(s,s,1);

      } else if (state === 'EXPLODE') {
        titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = false;

        // orbit photos (still keep your vibe)
        const baseAngle = groupGold.rotation.y;
        const angleStep = (Math.PI * 2) / 5;
        let bestIdx = 0; let maxZ = -999;

        photoMeshes.forEach((mesh, i) => {
          mesh.visible = true;
          const angle = baseAngle + i * angleStep;
          const x = Math.sin(angle) * CONFIG.photoOrbitRadius;
          const z = Math.cos(angle) * CONFIG.photoOrbitRadius;
          const y = Math.sin(time + i) * 3;
          mesh.position.lerp(new THREE.Vector3(x, y, z), 0.1);
          mesh.lookAt(camera.position);

          if (z > maxZ) { maxZ = z; bestIdx = i; }

          if (z > 5) {
            const ds = 1.0 + (z/CONFIG.photoOrbitRadius)*0.8;
            mesh.scale.lerp(new THREE.Vector3(ds, ds, ds), 0.1);
          } else {
            mesh.scale.lerp(new THREE.Vector3(0.6, 0.6, 0.6), 0.1);
          }
        });
        selectedIndex = bestIdx;

      } else if (state === 'PHOTO') {
        loveMesh.visible = false;
        photoMeshes.forEach((mesh, i) => {
          if (i === selectedIndex) {
            mesh.position.lerp(new THREE.Vector3(0, 0, 60), 0.1);
            mesh.scale.lerp(new THREE.Vector3(5, 5, 5), 0.1);
            mesh.lookAt(camera.position); mesh.rotation.z = 0;
          } else {
            mesh.scale.lerp(new THREE.Vector3(0,0,0), 0.1);
          }
        });
      }

      // FIREWORKS update
      updateFireworks();

      // candle flame flicker
      cakeCandles.forEach(({ flame, phase }) => {
        flame.lookAt(camera.position);
        const s = 1 + 0.25*Math.abs(Math.sin(time*8 + phase));
        flame.scale.set(s, s, 1);
        flame.material.opacity = 0.75 + 0.25*Math.abs(Math.sin(time*10 + phase));
      });

      // balloons float
      if (balloonGroup) {
        balloonGroup.children.forEach((b) => {
          b.position.y = b.userData.baseY + Math.sin(time*1.2 + b.userData.phase) * 2.2;
          b.position.x += Math.sin(time*0.3 + b.userData.phase) * 0.01;
          b.position.z += Math.cos(time*0.3 + b.userData.phase) * 0.01;
        });
      }

      // lover popup update
      updateLoverPopup(time);

      renderer.render(scene, camera);
    }

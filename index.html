<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamy 3-Tier Grand Cake</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #0d060d; font-family: 'Quicksand', sans-serif; }
        #canvas-container { width: 100%; height: 100vh; display: block; background: radial-gradient(circle at center, #2e122e 0%, #050205 100%); }
        
        #ui-layer {
            position: absolute; bottom: 30px; width: 100%;
            text-align: center; pointer-events: none; z-index: 100;
        }
        
        .badge {
            display: inline-block; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.5); color: #fff;
            padding: 12px 35px; border-radius: 50px;
            font-size: 24px; font-weight: bold; margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 3px;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(15px); font-family: 'Dancing Script', cursive;
        }

        .guide { color: #e0e0e0; font-size: 13px; margin-bottom: 25px; letter-spacing: 1px; opacity: 0.8; }
        .guide b { color: #FFD700; text-shadow: 0 0 5px rgba(255,215,0,0.5); }

        button {
            pointer-events: auto; cursor: pointer;
            background: rgba(255, 255, 255, 0.9);
            color: #4a148c; border: none;
            padding: 15px 50px; border-radius: 30px; 
            font-weight: 700; font-size: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        button:hover { transform: scale(1.05); background: #fff; box-shadow: 0 15px 40px rgba(255, 105, 180, 0.4); }

        /* ẨN CAMERA HOÀN TOÀN */
        #camera-preview, .input_video { display: none !important; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="status" class="badge">✨ Magical Celebration ✨</div>
        <br>
        <div class="guide">
            🖐 <b>Xòe tay:</b> Pháo Hoa & Ảnh | 👌 <b>Chạm ngón:</b> Ngắm Ảnh | ✊ <b>Nắm tay:</b> Hiện Bánh
        </div>
        <br>
        <button id="btnStart" onclick="startSystem()">Mở Quà Ngay</button>
    </div>

    <div id="canvas-container"></div>
    <video class="input_video"></video>
    <canvas id="camera-preview"></canvas>

    <script>
        const MUSIC_URL = "./audio.mp3"; 
        let bgMusic = new Audio(MUSIC_URL);
        bgMusic.loop = true;

        const loader = new THREE.TextureLoader();
        const photoFiles = ['./image1.jpeg', './image2.jpeg', './image3.jpeg', './image4.jpeg', './image5.jpeg'];
        const photoTextures = photoFiles.map(f => loader.load(f));

        function createTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createRadialGradient(64,64,0,64,64,64);
            if(type === 'star') {
                grd.addColorStop(0, 'rgba(255,255,255,1)');
                grd.addColorStop(0.2, 'rgba(255,230,150,0.8)');
                grd.addColorStop(1, 'rgba(0,0,0,0)');
            } else {
                grd.addColorStop(0, 'rgba(255,255,255,1)');
                grd.addColorStop(1, 'rgba(255,255,255,0)');
            }
            ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
            return new THREE.CanvasTexture(canvas);
        }

        const CONFIG = {
            t1R: 45, t1H: 22, t2R: 32, t2H: 18, t3R: 20, t3H: 14,
            totalH: 54, photoOrbit: 45
        };

        let scene, camera, renderer, cakeGroup, starGroup;
        let sprinkles, flames, confetti, photoMeshes = [];
        let state = 'CAKE', handX = 0.5, time = 0;
        let rainbowLight;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 1, 1000);
            camera.position.set(0, 50, 160);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            rainbowLight = new THREE.PointLight(0xff00ff, 1.5, 300);
            rainbowLight.position.set(50, 100, 50);
            scene.add(rainbowLight);

            const topLight = new THREE.SpotLight(0xffffff, 1);
            topLight.position.set(0, 200, 0);
            scene.add(topLight);

            createCake();
            createStars();
            sprinkles = createParticles(2000, 2, 'sprinkle');
            flames = createParticles(15, 6, 'flame');
            confetti = createParticles(400, 4, 'confetti');
            createPhotos();
            animate();
        }

        function createCake() {
            cakeGroup = new THREE.Group();
            const icingMat = new THREE.MeshPhysicalMaterial({
                color: 0xffeef2, roughness: 0.1, metalness: 0, 
                clearcoat: 1, clearcoatRoughness: 0, transmission: 0.2, thickness: 2
            });

            // Tiers
            const y1 = -CONFIG.totalH/2 + CONFIG.t1H/2;
            const y2 = y1 + CONFIG.t1H/2 + CONFIG.t2H/2;
            const y3 = y2 + CONFIG.t2H/2 + CONFIG.t3H/2;

            const t1 = new THREE.Mesh(new THREE.CylinderGeometry(CONFIG.t1R, CONFIG.t1R, CONFIG.t1H, 64), icingMat);
            t1.position.y = y1; cakeGroup.add(t1);

            const t2 = new THREE.Mesh(new THREE.CylinderGeometry(CONFIG.t2R, CONFIG.t2R, CONFIG.t2H, 64), icingMat);
            t2.position.y = y2; cakeGroup.add(t2);

            const t3 = new THREE.Mesh(new THREE.CylinderGeometry(CONFIG.t3R, CONFIG.t3R, CONFIG.t3H, 64), icingMat);
            t3.position.y = y3; cakeGroup.add(t3);

            // Cake Stand (Đế bánh)
            const standMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9, roughness: 0.1 });
            const plate = new THREE.Mesh(new THREE.CylinderGeometry(CONFIG.t1R + 5, CONFIG.t1R + 5, 2, 64), standMat);
            plate.position.y = -CONFIG.totalH/2 - 1;
            cakeGroup.add(plate);
            
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(10, 15, 20, 32), standMat);
            leg.position.y = -CONFIG.totalH/2 - 11;
            cakeGroup.add(leg);

            // Pearl Piping (Ngọc trai bao quanh)
            const pearlMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0 });
            const addPearls = (r, y) => {
                const count = 40;
                for(let i=0; i<count; i++) {
                    const p = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), pearlMat);
                    const a = (i/count) * Math.PI * 2;
                    p.position.set(r * Math.cos(a), y, r * Math.sin(a));
                    cakeGroup.add(p);
                }
            };
            addPearls(CONFIG.t1R, y1 + CONFIG.t1H/2);
            addPearls(CONFIG.t2R, y2 + CONFIG.t2H/2);

            scene.add(cakeGroup);
        }

        function createStars() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<1000; i++) {
                pos.push((Math.random()-0.5)*400, Math.random()*300, (Math.random()-0.5)*400);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            starGroup = new THREE.Points(geo, new THREE.PointsMaterial({ size: 2, map: createTexture('star'), transparent: true, opacity: 0.8 }));
            scene.add(starGroup);
        }

        function createParticles(count, size, type) {
            const geo = new THREE.BufferGeometry();
            const pos = [], cakePos = [], explodePos = [], colors = [];
            const color = new THREE.Color();

            for(let i=0; i<count; i++) {
                let x=0, y=0, z=0;
                if(type === 'sprinkle') {
                    const a = Math.random()*Math.PI*2;
                    const r = Math.random() < 0.5 ? CONFIG.t1R : CONFIG.t2R;
                    x = r * Math.cos(a); z = r * Math.sin(a);
                    y = (Math.random()-0.5)*CONFIG.totalH;
                    color.setHSL(Math.random(), 0.8, 0.8);
                } else if(type === 'flame') {
                    const a = (i/count)*Math.PI*2;
                    x = (CONFIG.t2R-5)*Math.cos(a); z = (CONFIG.t2R-5)*Math.sin(a);
                    y = CONFIG.totalH/2 + 5;
                    color.set(0xffaa00);
                }
                cakePos.push(x, y, z);
                
                const rad = 100 * Math.cbrt(Math.random());
                const u = Math.random(), v = Math.random();
                const theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
                explodePos.push(rad * Math.sin(phi)*Math.cos(theta), rad * Math.sin(phi)*Math.sin(theta), rad*Math.cos(phi));
                
                pos.push(x, y, z);
                colors.push(color.r, color.g, color.b);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.userData = { cake: cakePos, explode: explodePos };
            return new THREE.Points(geo, new THREE.PointsMaterial({ size, vertexColors: true, map: createTexture(), transparent: true, blending: THREE.AdditiveBlending }));
        }

        function createPhotos() {
            const geo = new THREE.PlaneGeometry(12, 12);
            photoTextures.forEach(tex => {
                const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                const frame = new THREE.Mesh(new THREE.PlaneGeometry(13, 13), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                frame.position.z = -0.1; m.add(frame);
                m.visible = false; scene.add(m); photoMeshes.push(m);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            
            // Magical Light
            rainbowLight.color.setHSL((time * 0.1) % 1, 0.8, 0.5);
            starGroup.position.y -= 0.2; if(starGroup.position.y < -150) starGroup.position.y = 150;

            const targetState = state === 'PHOTO' ? 'explode' : state.toLowerCase();
            [sprinkles, flames, confetti].forEach(p => {
                if(!p) return;
                const pos = p.geometry.attributes.position.array;
                const target = p.geometry.userData[targetState === 'cake' ? 'cake' : 'explode'];
                for(let i=0; i<pos.length; i++) pos[i] += (target[i] - pos[i]) * 0.05;
                p.geometry.attributes.position.needsUpdate = true;
                if(state === 'CAKE') p.rotation.y += 0.01;
            });

            if(state === 'CAKE') {
                cakeGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
                cakeGroup.rotation.y += 0.01;
                photoMeshes.forEach(m => m.visible = false);
            } else {
                cakeGroup.scale.lerp(new THREE.Vector3(0,0,0), 0.1);
                photoMeshes.forEach((m, i) => {
                    m.visible = true;
                    if(state === 'EXPLODE') {
                        const a = time * 0.5 + i * (Math.PI*2/5);
                        m.position.lerp(new THREE.Vector3(Math.cos(a)*CONFIG.photoOrbit, Math.sin(time+i)*5, Math.sin(a)*CONFIG.photoOrbit), 0.1);
                        m.scale.set(1,1,1); m.lookAt(camera.position);
                    } else if(i === 0) { // Simple zoom for the first photo as example
                        m.position.lerp(new THREE.Vector3(0, 10, 100), 0.1);
                        m.scale.lerp(new THREE.Vector3(4, 4, 4), 0.1);
                        m.lookAt(camera.position);
                    } else { m.scale.lerp(new THREE.Vector3(0,0,0), 0.1); }
                });
            }
            renderer.render(scene, camera);
        }

        function startSystem() {
            document.getElementById('btnStart').style.display = 'none';
            bgMusic.play();
            init3D();

            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults(res => {
                if(res.multiHandLandmarks.length > 0) {
                    const lm = res.multiHandLandmarks[0];
                    const open = Math.hypot(lm[8].x - lm[0].x, lm[8].y - lm[0].y) > 0.3;
                    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) < 0.05;
                    state = pinch ? 'PHOTO' : (open ? 'EXPLODE' : 'CAKE');
                }
            });

            const video = document.querySelector('.input_video');
            const cam = new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 640, height: 480 });
            cam.start();
        }
    </script>
</body>
</html>v

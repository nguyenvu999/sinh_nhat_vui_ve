<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wishes Ultimate</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #1a0f1a; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100%; height: 100vh; display: block; background: radial-gradient(circle at center, #4a2c4a 0%, #000000 100%); }
        
        #ui-layer {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; pointer-events: none; z-index: 100;
        }
        
        .badge {
            display: inline-block; background: rgba(255, 182, 193, 0.4);
            border: 3px solid #FFD700; color: #FFF;
            padding: 12px 30px; border-radius: 50px;
            font-size: 20px; font-weight: bold; margin-bottom: 15px;
            text-transform: uppercase; letter-spacing: 1.5px;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px); font-family: 'Pacifico', cursive;
        }

        .guide { color: #ffcce0; font-size: 15px; margin-bottom: 25px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-weight: 600; background: rgba(0,0,0,0.3); display: inline-block; padding: 5px 15px; border-radius: 20px;}
        .guide b { color: #FFD700; }

        button {
            pointer-events: auto; cursor: pointer;
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #bf3f3f; border: 3px solid #fff;
            padding: 18px 60px; border-radius: 35px; 
            font-weight: 900; font-size: 18px;
            box-shadow: 0 10px 30px rgba(255, 154, 158, 0.5);
            animation: floating 3s ease-in-out infinite;
            text-transform: uppercase; transition: all 0.3s ease;
        }
        button:hover { transform: scale(1.1); background: linear-gradient(45deg, #fad0c4 0%, #ff9a9e 100%); color: white;}
        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        #camera-preview {
            position: absolute; top: 20px; right: 20px;
            width: 140px; height: 105px;
            border: 3px solid rgba(255, 255, 255, 0.7); 
            transform: scaleX(-1); opacity: 0.7; border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        #error-log { display: none; position: absolute; top: 0; left: 0; color: red; background: rgba(0,0,0,0.8); z-index: 999; padding: 10px; }
    </style>
</head>
<body>
    <div id="error-log"></div>
    <div id="ui-layer">
        <div id="status" class="badge" style="color: #FFD700;">🎂 Chúc Mừng Sinh Nhật 🎂</div>
        <br>
        <div class="guide">
            🖐 <b>Xòe tay:</b> Bung Lụa! &nbsp;|&nbsp; 👌 <b>Chạm ngón:</b> Xem Ảnh &nbsp;|&nbsp; ✊ <b>Nắm tay:</b> Hiện Bánh Kem
        </div>
        <br>
        <button id="btnStart" onclick="startSystem()">Bắt Đầu Bữa Tiệc!</button>
    </div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none"></video>
    <canvas id="camera-preview"></canvas>

    <script>
        // ==========================================
        // 1. Cấu hình & Tài nguyên (Nâng cấp hình ảnh)
        // ==========================================
        const MUSIC_URL = "./audio.mp3"; 
        let bgMusic = new Audio(MUSIC_URL);
        bgMusic.loop = true; bgMusic.volume = 0.6;

        const loader = new THREE.TextureLoader();
        const photoFiles = ['./image1.jpeg', './image2.jpeg', './image3.jpeg', './image4.jpeg', './image5.jpeg'];
        const photoTextures = [];
        photoFiles.forEach((f, i) => photoTextures[i] = loader.load(f));

        // --- Tạo Texture nét hơn ---
        function createCustomTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128; // Tăng độ phân giải
            const ctx = canvas.getContext('2d');
            const cx = 64, cy = 64;

            if (type === 'candle_flame') {
                // Ngọn lửa nến chân thực hơn
                const grd = ctx.createRadialGradient(cx, cy, 10, cx, cy, 60);
                grd.addColorStop(0, 'rgba(255, 255, 200, 1)'); // Tâm trắng vàng
                grd.addColorStop(0.4, 'rgba(255, 150, 0, 0.8)'); // Giữa cam
                grd.addColorStop(0.8, 'rgba(200, 50, 0, 0.3)'); // Viền đỏ
                grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
            } else {
                // Confetti / Sprinkles (Tròn, sắc nét)
                ctx.beginPath();
                ctx.arc(cx, cy, 60, 0, Math.PI * 2);
                ctx.fillStyle = "#FFFFFF";
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        const commonTextures = {
            flame: createCustomTexture('candle_flame'),
            particleBase: createCustomTexture('particle')
        };

        // ==========================================
        // 2. Thông số kỹ thuật Bánh Kem Rắn
        // ==========================================
        const CONFIG = {
            sprinkleCount: 2000, // Số hạt cốm rắc
            candleCount: 12,      // Số cây nến (ít hơn nhưng chất hơn)
            confettiCount: 300,
            explodeRadius: 90,
            photoOrbitRadius: 35,
            // Kích thước cốt bánh
            t1R: 45, t1H: 30, // Tầng 1 (Radius, Height)
            t2R: 30, t2H: 25, // Tầng 2
        };
        CONFIG.totalH = CONFIG.t1H + CONFIG.t2H;

        let scene, camera, renderer;
        let cakeSolidGroup; // Nhóm chứa cốt bánh rắn và thân nến
        let groupSprinkles, groupCandleFlames, groupConfetti;
        let photoMeshes = [];    
        let titleMesh, subTitleMesh;
        
        let state = 'CAKE'; 
        let selectedIndex = 0;
        let handX = 0.5;
        let time = 0;

        // ==========================================
        // 3. Khởi tạo 3D Scene & Bánh Kem Đẹp
        // ==========================================
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1a0f1a, 0.001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 140); // Góc nhìn cao hơn một chút
            camera.lookAt(0, 10, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true; // Bật đổ bóng
            container.appendChild(renderer.domElement);

            // --- Ánh sáng (Quan trọng để bánh đẹp) ---
            const ambientLight = new THREE.AmbientLight(0xffd1dc, 0.5); // Ánh sáng môi trường hồng phấn
            scene.add(ambientLight);

            const mainLight = new THREE.PointLight(0xfffff0, 1.2, 300); // Đèn chính màu kem
            mainLight.position.set(50, 80, 50);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const rimLight = new THREE.PointLight(0xffaec9, 0.8, 300); // Đèn viền màu hồng đậm
            rimLight.position.set(-50, 20, -50);
            scene.add(rimLight);

            // --- Tạo Cốt Bánh Rắn (Solid Cake) ---
            createSolidCake();

            // --- Tạo các nhóm hạt (Particles) ---
            groupSprinkles = createParticleSystem('sprinkle', CONFIG.sprinkleCount, 1.8);
            groupCandleFlames = createParticleSystem('candle_flame', CONFIG.candleCount, 5.0);
            groupConfetti = createParticleSystem('confetti', CONFIG.confettiCount, 4.0);

            createPhotos();
            createDecorations();
            animate();
        }

        // Hàm tạo cốt bánh rắn và thân nến
        function createSolidCake() {
            cakeSolidGroup = new THREE.Group();

            // Chất liệu kem (Icing Material)
            const icingMat = new THREE.MeshStandardMaterial({
                color: 0xffbbcc, // Màu hồng kem
                roughness: 0.4,  // Độ nhám vừa phải
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            // Tầng 1
            const tier1Geo = new THREE.CylinderGeometry(CONFIG.t1R, CONFIG.t1R, CONFIG.t1H, 64);
            const tier1Mesh = new THREE.Mesh(tier1Geo, icingMat);
            tier1Mesh.position.y = CONFIG.t1H / 2 - CONFIG.totalH / 2;
            tier1Mesh.receiveShadow = true; tier1Mesh.castShadow = true;
            cakeSolidGroup.add(tier1Mesh);

            // Tầng 2
            const tier2Geo = new THREE.CylinderGeometry(CONFIG.t2R, CONFIG.t2R, CONFIG.t2H, 64);
            const tier2Mesh = new THREE.Mesh(tier2Geo, icingMat);
            tier2Mesh.position.y = CONFIG.t1H + CONFIG.t2H / 2 - CONFIG.totalH / 2;
            tier2Mesh.receiveShadow = true; tier2Mesh.castShadow = true;
            cakeSolidGroup.add(tier2Mesh);

            // Thêm thân nến (Sáp nến rắn)
            const waxMat = new THREE.MeshStandardMaterial({ color: 0xffeeaa, roughness: 0.2 });
            const candleGeo = new THREE.CylinderGeometry(1.2, 1.2, 8, 16);
            
            for(let i=0; i<CONFIG.candleCount; i++) {
                const mesh = new THREE.Mesh(candleGeo, waxMat);
                // Vị trí nến (sẽ khớp với vị trí ngọn lửa particle sau này)
                let r, y;
                const angle = (i / CONFIG.candleCount) * Math.PI * 2;
                if (i % 2 === 0) { // Tầng dưới
                     r = CONFIG.t1R - 5; y = CONFIG.t1H - CONFIG.totalH/2 + 4;
                } else { // Tầng trên
                     r = CONFIG.t2R - 4; y = CONFIG.totalH/2 + 4;
                }
                mesh.position.set(r * Math.cos(angle), y, r * Math.sin(angle));
                mesh.castShadow = true;
                cakeSolidGroup.add(mesh);
            }

            scene.add(cakeSolidGroup);
        }


        function createParticleSystem(type, count, size) {
            const pPositions = [];
            const pExplodeTargets = [];
            const pCakeTargets = [];
            const colors = [];
            const colorObj = new THREE.Color();
            
            for(let i=0; i<count; i++) {
                let tx, ty, tz;
                
                // --- Định vị hạt trên bề mặt bánh ---
                if (type === 'sprinkle') {
                    const tier = Math.random() > 0.4 ? 1 : 2;
                    let r, hRel, yBase;
                    if (tier === 1) { r=CONFIG.t1R; hRel=CONFIG.t1H; yBase = -CONFIG.totalH/2; }
                    else { r=CONFIG.t2R; hRel=CONFIG.t2H; yBase = CONFIG.t1H - CONFIG.totalH/2; }

                    // Rắc trên mặt phẳng hoặc xung quanh thành
                    if(Math.random() > 0.3) { // Xung quanh thành
                         const theta = Math.random() * Math.PI * 2;
                         tx = (r + 0.5) * Math.cos(theta); // +0.5 để nổi lên trên cốt bánh
                         ty = yBase + Math.random() * hRel;
                         tz = (r + 0.5) * Math.sin(theta);
                    } else { // Trên mặt phẳng
                        const theta = Math.random() * Math.PI * 2;
                        const rad = Math.sqrt(Math.random()) * r;
                         tx = rad * Math.cos(theta);
                         ty = yBase + hRel + 0.5;
                         tz = rad * Math.sin(theta);
                    }
                    // Màu cốm pastel
                    colorObj.setHSL(Math.random(), 0.7, 0.8);
                    colors.push(colorObj.r, colorObj.g, colorObj.b);

                } else if (type === 'candle_flame') {
                    // Vị trí ngọn lửa khớp với đỉnh thân nến đã tạo
                    const angle = (i / count) * Math.PI * 2;
                    let r, y;
                    if (i % 2 === 0) { r = CONFIG.t1R - 5; y = CONFIG.t1H - CONFIG.totalH/2 + 8 + 2; } // + chiều cao nến + offset lửa
                    else { r = CONFIG.t2R - 4; y = CONFIG.totalH/2 + 8 + 2; }
                    tx = r * Math.cos(angle); ty = y; tz = r * Math.sin(angle);
                    colorObj.set(0xffaa00); colors.push(colorObj.r, colorObj.g, colorObj.b);

                } else {
                    // Confetti
                    tx=0; ty=0; tz=0;
                    colorObj.setHSL(Math.random(), 1.0, 0.6); colors.push(colorObj.r, colorObj.g, colorObj.b);
                }
                pCakeTargets.push(tx, ty, tz);

                // --- Vị trí nổ ---
                const u = Math.random(); const v = Math.random();
                const phi = Math.acos(2 * v - 1); const lam = 2 * Math.PI * u;
                let radMult = (type === 'confetti') ? 1.5 : (type==='candle_flame' ? 0.2 : 1.0);
                const rad = CONFIG.explodeRadius * Math.cbrt(Math.random()) * radMult;
                pExplodeTargets.push(rad * Math.sin(phi) * Math.cos(lam), rad * Math.sin(phi) * Math.sin(lam), rad * Math.cos(phi));

                if(type==='confetti') pPositions.push(0,0,0); else pPositions.push(tx, ty, tz);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.userData = { cake: pCakeTargets, explode: pExplodeTargets };

            let mat;
            if (type === 'candle_flame') {
                mat = new THREE.PointsMaterial({ size: size, map: commonTextures.flame, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
            } else {
                 mat = new THREE.PointsMaterial({ size: size, vertexColors: true, map: commonTextures.particleBase, transparent: true, opacity: (type==='sprinkle'?0.9:0.8), blending: THREE.NormalBlending, depthWrite: false });
            }

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            return points;
        }

        function createPhotos() {
            const geo = new THREE.PlaneGeometry(12, 12); 
            const borderGeo = new THREE.PlaneGeometry(13, 13); 
            // Viền ảnh lấp lánh
            const borderMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 }); 

            for(let i=0; i<5; i++) {
                const mat = new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geo, mat);
                const border = new THREE.Mesh(borderGeo, borderMat);
                border.position.z = -0.1; 
                mesh.add(border);
                mesh.visible = false; mesh.scale.set(0,0,0);
                scene.add(mesh);
                photoMeshes.push(mesh);
            }
        }

        function createDecorations() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            // Font chữ đẹp hơn
            ctx.font = 'bold 110px "Dancing Script", cursive'; 
            ctx.fillStyle = '#FFD700'; ctx.textAlign = 'center';
            ctx.shadowColor = "#FF1493"; ctx.shadowBlur = 35; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
            ctx.fillText("HAPPY BIRTHDAY", 512, 130);
            ctx.strokeStyle = '#FFF'; ctx.lineWidth = 3; ctx.strokeText("HAPPY BIRTHDAY", 512, 130);
            
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side:THREE.DoubleSide });
            titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(75, 18.75), mat);
            titleMesh.position.set(0, 75, 0);
            scene.add(titleMesh);

            const subCanvas = document.createElement('canvas');
            subCanvas.width = 1024; subCanvas.height = 128;
            const subCtx = subCanvas.getContext('2d');
            subCtx.font = '40px "Pacifico", cursive';
            subCtx.fillStyle = '#ffb7c5'; subCtx.textAlign = 'center';
            subCtx.shadowColor = "rgba(0,0,0,0.5)"; subCtx.shadowBlur = 5;
            subCtx.fillText("Chúc em tuổi mới luôn rạng ngời! ❤️", 512, 70);

            const subTex = new THREE.CanvasTexture(subCanvas);
            subTitleMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 7.5), new THREE.MeshBasicMaterial({ map: subTex, transparent: true, side:THREE.DoubleSide }));
            subTitleMesh.position.set(0, 55, 0);
            scene.add(subTitleMesh);
        }

        function updateParticleGroup(group, targetState, speed, handRotY, time, type) {
            const positions = group.geometry.attributes.position.array;
            const targetKey = (targetState === 'CAKE') ? 'cake' : 'explode';
            const targets = group.geometry.userData[(targetState === 'PHOTO') ? 'explode' : targetKey];

            for(let i=0; i<positions.length; i++) {
                positions[i] += (targets[i] - positions[i]) * speed;
            }
            group.geometry.attributes.position.needsUpdate = true;
            
            if (targetState === 'CAKE') {
                // Hạt dính vào bánh, xoay cùng bánh rắn
                group.rotation.copy(cakeSolidGroup.rotation);
                
                if(type === 'candle_flame') {
                    // Ngọn lửa nhấp nháy
                    const scale = 1 + Math.sin(time * 10 + group.uuid.charCodeAt(0)) * 0.2;
                    group.scale.set(scale, scale, scale);
                } else {
                    group.scale.set(1,1,1);
                }
            } else {
                // Hạt nổ ra, xoay tự do theo tay
                group.scale.set(1,1,1);
                group.rotation.y += (handRotY - group.rotation.y) * 0.08;
                group.rotation.x = Math.sin(time * 0.5)*0.1;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            time = Date.now() * 0.001;
            const speed = 0.05;
            const handRotY = (handX - 0.5) * 2.5;

            // Xoay cốt bánh rắn nhẹ nhàng
            if (state === 'CAKE') {
                 cakeSolidGroup.rotation.y = Math.sin(time * 0.3) * 0.2;
            }
            
            // Cập nhật các nhóm hạt
            updateParticleGroup(groupSprinkles, state, speed, handRotY, time, 'sprinkle');
            updateParticleGroup(groupCandleFlames, state, speed, handRotY, time, 'candle_flame');
            updateParticleGroup(groupConfetti, state, speed * 1.2, handRotY, time, 'confetti');

            photoMeshes.forEach((mesh, i) => {
                if(!mesh.material.map && photoTextures[i]) {
                    mesh.material.map = photoTextures[i]; mesh.material.needsUpdate = true;
                }
            });

            // --- Xử lý trạng thái & Hiệu ứng chuyển đổi ---
            const solidScaleTarget = (state === 'CAKE') ? 1 : 0;
            // Lerp scale của cốt bánh rắn để hiện/ẩn mượt mà
            cakeSolidGroup.scale.lerp(new THREE.Vector3(solidScaleTarget, solidScaleTarget, solidScaleTarget), 0.08);
            
            if (state === 'CAKE') {
                titleMesh.visible = true; subTitleMesh.visible = true;
                titleMesh.position.y = 75 + Math.sin(time * 2) * 1.5;
                titleMesh.lookAt(camera.position); subTitleMesh.lookAt(camera.position);
                titleMesh.scale.lerp(new THREE.Vector3(1,1,1), 0.05);
                subTitleMesh.scale.lerp(new THREE.Vector3(1,1,1), 0.05);
                photoMeshes.forEach(m => { m.scale.lerp(new THREE.Vector3(0,0,0), 0.1); m.visible = false; });

            } else if (state === 'EXPLODE') {
                titleMesh.visible = false; subTitleMesh.visible = false;
                const baseAngle = time * 0.3;
                const angleStep = (Math.PI * 2) / 5;
                let bestIdx = 0; let maxZ = -999;

                photoMeshes.forEach((mesh, i) => {
                    mesh.visible = true;
                    const angle = baseAngle + i * angleStep;
                    const x = Math.sin(angle) * CONFIG.photoOrbitRadius;
                    const z = Math.cos(angle) * CONFIG.photoOrbitRadius + 10; // Đẩy ra xa một chút
                    const y = Math.sin(time + i) * 5; 

                    mesh.position.lerp(new THREE.Vector3(x, y, z), 0.08);
                    mesh.lookAt(camera.position);

                    if (z > maxZ) { maxZ = z; bestIdx = i; }
                    
                    if (z > 15) { 
                        const distScale = 1.0 + (z / CONFIG.photoOrbitRadius) * 0.4; 
                        mesh.scale.lerp(new THREE.Vector3(distScale, distScale, distScale), 0.08);
                    } else {
                        mesh.scale.lerp(new THREE.Vector3(0.7, 0.7, 0.7), 0.08);
                    }
                });
                selectedIndex = bestIdx;

            } else if (state === 'PHOTO') {
                photoMeshes.forEach((mesh, i) => {
                    if (i === selectedIndex) {
                        mesh.position.lerp(new THREE.Vector3(0, 5, 80), 0.08);
                        mesh.scale.lerp(new THREE.Vector3(7, 7, 7), 0.08);
                        mesh.lookAt(camera.position);
                        mesh.rotation.z = Math.sin(time * 0.8) * 0.03;
                    } else {
                        mesh.scale.lerp(new THREE.Vector3(0,0,0), 0.08);
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // ==========================================
        // 4. Khởi động hệ thống & Xử lý tay
        // ==========================================
        function startSystem() {
            document.getElementById('btnStart').style.display = 'none';
            bgMusic.play().then(() => console.log("Music playing")).catch(e => {
                console.log("Auto-play blocked, waiting for interaction.");
                document.body.addEventListener('click', () => bgMusic.play(), {once:true});
            });
            
            init3D();

            const video = document.getElementsByClassName('input_video')[0];
            const canvas = document.getElementById('camera-preview');
            const ctx = canvas.getContext('2d');
            const statusDiv = document.getElementById('status');
            
            let frameCnt = 0;
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

            hands.onResults(results => {
                ctx.save(); ctx.scale(-1, 1); ctx.translate(-canvas.width, 0);
                ctx.clearRect(0,0,canvas.width,canvas.height); 
                ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                if(results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    handX = lm[9].x; 
                    const wrist = lm[0];
                    let openDist = 0;
                    [8,12,16,20].forEach(i => openDist += Math.hypot(lm[i].x-wrist.x, lm[i].y-wrist.y));
                    const avgDist = openDist / 4;
                    const pinchDist = Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y);

                    if (avgDist < 0.25) { 
                        state = 'CAKE'; 
                        statusDiv.innerText = "✊ Đang giữ Bánh Kem"; statusDiv.style.color = "#FFB7C5";
                        statusDiv.style.borderColor = "#FFB7C5";
                    } else if (pinchDist < 0.06) {
                        state = 'PHOTO';
                        statusDiv.innerText = "👌 Đang ngắm Ảnh"; statusDiv.style.color = "#00FFFF";
                        statusDiv.style.borderColor = "#00FFFF";
                    } else {
                        state = 'EXPLODE'; 
                        statusDiv.innerText = "🖐 Bung Lụa & Ảnh!"; statusDiv.style.color = "#FFD700";
                        statusDiv.style.borderColor = "#FFD700";
                    }
                } else {
                    if(state !== 'CAKE') {
                         state = 'CAKE';
                         statusDiv.innerText = "🎂 Chúc Mừng Sinh Nhật 🎂"; statusDiv.style.color = "#FFD700";
                         statusDiv.style.borderColor = "#FFD700";
                    }
                }
            });

            const cameraUtils = new Camera(video, {
                onFrame: async () => { frameCnt++; if(frameCnt%2 === 0) await hands.send({image: video}); },
                width: 640, height: 480
            });
            cameraUtils.start();
        }

        window.addEventListener('resize', () => {
            if(camera) { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        });
    </script>
</body>
</html>
